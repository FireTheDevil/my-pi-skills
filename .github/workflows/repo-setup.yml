name: Validate repo setup

on:
  pull_request:
    paths:
      - 'skills/repo-setup/**'
      - '.github/workflows/repo-setup.yml'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'skills/repo-setup/**'
      - '.github/workflows/repo-setup.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-setup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    name: Linux / Python 3.12 safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up uv for the real offline interpreter-discovery test
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          download-from-astral-mirror: false
          enable-cache: false
      - name: Record tools and require offline Python discovery
        run: |
          python --version
          git --version
          uv --version
          uv python find --no-project --no-config --system --no-python-downloads --offline --no-cache 3.12
      - name: Run every safety regression without skips
        env:
          UV_PYTHON_DOWNLOADS: never
          UV_OFFLINE: '1'
          UV_NO_SYNC: '1'
          BUN_CONFIG_NO_AUTO_INSTALL: '1'
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover('skills/repo-setup/tests')
          if suite.countTestCases() == 0:
              sys.exit('No repo-setup safety tests were discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped or result.expectedFailures:
              print('Safety CI requires all tests to run and pass', file=sys.stderr)
          sys.exit(not result.wasSuccessful() or bool(result.skipped or result.expectedFailures))
          PY
      - name: Check all five scaffold and rerun paths without installs
        run: python skills/repo-setup/scripts/verify.py --scaffold-only
      - name: Compile helper and test sources only
        # Do not create __pycache__ inside reviewed template assets.
        run: python -m compileall -q skills/repo-setup/scripts skills/repo-setup/tests
      - name: Check for unintended tracked changes
        run: git diff --exit-code HEAD
